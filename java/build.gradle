plugins {
    id 'com.gradleup.shadow' version '9.6.1'
    id 'java'
}


def gitVersion = { ->
    def execOutput = providers.exec {
        commandLine 'git', 'describe', '--tags', '--dirty'
        ignoreExitValue = true
    }
    if (execOutput.result.get().exitValue != 0) {
        return "0.0.0+development-SNAPSHOT"
    }
    def stdout = execOutput.standardOutput.asText.get()
    def pattern = ~/v([0-9]+)(?:.([0-9]+))?(?:.([0-9]+))?(?:-(alpha|beta|pre|rc).([0-9]+))?(?:-([0-9]+)-([a-g0-9]+))?(-dirty)?/
    def newVersion = stdout.trim().replaceFirst(pattern) { _,major,minor,patch,pre,preVersion,com,hash,dirty ->
        def incremented = false
        def result = ''
        if (com != null || hash != null || dirty != null) {
            result = '-SNAPSHOT'
        } else {
            incremented = true
        }
        if (pre != null && preVersion != null) {
            if (!incremented) {
                preVersion = (preVersion as int) + 1
                incremented = true
            }
            result = "-${pre}${preVersion}${result}"
        }
        if (patch != null) {
            if (!incremented) {
                patch = (patch as int) + 1
                incremented = true
            }
            result = ".${patch}${result}"
        }
        if (minor != null) {
            if (!incremented) {
                minor = (minor as int) + 1
                incremented = true
            }
            result = ".${minor}${result}"
        }
        if (!incremented) {
            major = (major as int) + 1
        }
        result = "${major}${result}"
        return result
    }
    return newVersion
}

group = 'edu.umn.biomedicus'
version = gitVersion()

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation group: 'org.jetbrains', name: 'annotations', version: '26.0.2'

    implementation group: 'edu.umn.nlpie', name: 'mtap', version: '1.5.+'

    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.17'
    implementation group: 'args4j', name: 'args4j', version: '2.37'
    implementation group: 'org.rocksdb', name: 'rocksdbjni', version: '9.10.0'
    implementation group: 'org.apache.commons', name: 'commons-text', version: '1.13.0'
    implementation group: 'org.yaml', name: 'snakeyaml', version: '2.4'
    implementation group: 'jakarta.xml.bind', name: 'jakarta.xml.bind-api', version: '4.0.2'

    implementation group: 'io.grpc', name: 'grpc-netty-shaded', version: '1.71.0'
    implementation group: 'io.grpc', name: 'grpc-protobuf', version: '1.71.0'
    implementation group: 'io.grpc', name: 'grpc-stub', version: '1.71.0'
    implementation group: 'io.grpc', name: 'grpc-services', version: '1.71.0'

    runtimeOnly group: 'org.glassfish.jaxb', name: 'jaxb-runtime', version: '4.0.5'
    runtimeOnly group: 'org.apache.logging.log4j', name: 'log4j-slf4j2-impl', version: '2.24.3'
    runtimeOnly group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.24.3'

    testImplementation(platform('org.junit:junit-bom:5.12.1'))
    testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.16.1'
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
    useJUnitPlatform()
    testLogging {
		events "passed", "skipped", "failed"
	}
}

shadowJar {
    manifest {
        attributes 'Implementation-Title': 'BioMedICUS',
                'Description': 'A system for large-scale text analysis and processing of biomedical and clinical reports.',
                'Implementation-Version': archiveVersion
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:unchecked'
    options.deprecation = true
}

tasks.register('execute', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    if (project.hasProperty('mainClass')) {
        mainClass = project.property('mainClass') as String
    }
}

tasks.register('conceptsUtility', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'edu.umn.biomedicus.concepts.ConceptsUtility'
}

tasks.register('writeVersion') {
    def versionFile = layout.buildDirectory.file('version.txt')
    def versionString = version.toString()
    doLast {
        versionFile.get().asFile.text = "${versionString}\n"
    }
}

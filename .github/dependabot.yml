version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/"
      - "/biomedicus_client/"
    schedule:
      interval: weekly
    ignore:
      # Versions newer than 2.1.0 and newer of numpy do not support Python 3.9. Revisit when 3.9 is dropped.
      - dependency-name: "numpy"
        versions: [">=2.1.0"]
    groups:
      all-py:
        patterns:
          - "*"
  - package-ecosystem: gradle
    directory: /java/
    schedule:
      interval: weekly
    groups:
      all-java:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/" # Do not change this to /.github/workflows, use "/"
    schedule:
      interval: "weekly"
    groups:
      all-actions:
        patterns:
          - "*"
